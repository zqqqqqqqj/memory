[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query-residual-memory-ablations"
version = "0.3.0"
description = "Bounded residual memory, independent action controls and closed-loop validated SFT"
requires-python = ">=3.11"
dependencies = ["torch>=2.7,<2.8", "numpy>=1.26,<2", "PyYAML>=6", "safetensors>=0.4", "av>=17,<18", "pyarrow>=15"]

[project.optional-dependencies]
test = ["pytest>=8"]
online = ["wandb>=0.18", "requests>=2"]
prepare = ["requests>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
